[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peopleflow-slack"
version = "0.1.0"
description = "Employee Slack interface for the PeopleFlow AI demo"
requires-python = ">=3.10"
dependencies = ["slack-bolt>=1.23,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["peopleflow_slack*"]
