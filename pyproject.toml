[tool.pytest.ini_options]
testpaths = ["tests", "slack/tests"]
pythonpath = [".", "slack"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "slack"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
