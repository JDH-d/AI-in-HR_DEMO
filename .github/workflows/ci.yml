name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            slack/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Backend and Slack tests, including isolated end-to-end scenarios
        run: PEOPLEFLOW_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" python -m pytest -q
      - run: python -m scripts.run_rag_eval

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            slack/pyproject.toml
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Shared Windows startup, shutdown and Slack connectivity regressions
        run: .\.venv\Scripts\python.exe -m pytest tests/test_launcher.py slack/tests/test_runtime_health.py slack/tests/test_config.py slack/tests/test_startup.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build
